<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laptop Product Page</title>
    <style>
body {
    font-family: Arial, sans-serif;
    background-color: #f4f6f8;
    margin: auto;
    padding: 0;
}

.container {
    width: 60%;
    margin: 40px auto;
    background-color: #ffffff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(172, 9, 9, 0.1);
    border: 2px solid black;
    text-align: center;
}

h1 {
    color: #2c3e50;
}

h2 {
    color: #34495e;
}
p {
    color: #555;
    line-height: 1.6;
    margin-top: 20px;
}

img {
    width: 300px;
    border-radius: 10px;
    margin: 15px 0;
}

.price {
    color: #27ae60;
    font-size: 22px;
    font-weight: bold;
    margin-top: 10px;
}

.btn {
    display: inline-block;
    margin-top: 15px;
    padding: 10px 20px;
    background-color: #3498db;
    color: white;
    text-decoration: none;
    border-radius: 5px;
}

.btn:hover {
    background-color: #2980b9;
}
    </style>
</head>
<body>
    <div class="container">
        <h1>Laptop</h1>

        <img src="laptop.jpg" alt="High Performance Laptop">

        <h2>Product Description</h2>
        

        <div class="price">₹75,000</div>

        <a href="#" class="btn">Buy Now</a>
    </div>

</body>
</html>
